<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الاختبار الذكي - لوحة المعلم</title>
    <style>
        :root { --primary: #2c3e50; --secondary: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; max-width: 600px; width: 100%; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .timer { font-size: 24px; color: var(--danger); font-weight: bold; text-align: center; margin-bottom: 20px; background: #fff5f5; padding: 10px; border-radius: 8px; border: 1px solid var(--danger); position: sticky; top: 10px; z-index: 100; }
        .question-box { background: #f9f9f9; padding: 15px; margin-bottom: 20px; border-radius: 8px; text-align: right; border-right: 5px solid var(--secondary); transition: 0.3s; }
        input[type="text"] { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn { background: var(--secondary); color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .hidden { display: none; }
        .warning-text { color: var(--danger); font-weight: bold; margin-bottom: 15px; text-align: center; border: 1px dashed var(--danger); padding: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- 1. شاشة الدخول -->
    <div id="start-screen">
        <h2>بدء الاختبار</h2>
        <p style="text-align: center;">يرجى إدخال اسمك لبدء الامتحان. (الوقت: 5 دقائق)</p>
        <input type="text" id="student-name" placeholder="اكتب اسمك الثلاثي هنا..." autocomplete="off">
        <button onclick="startExam()" class="btn">دخول الامتحان</button>
    </div>

    <!-- 2. شاشة الأسئلة -->
    <div id="exam-screen" class="hidden">
        <div class="timer">الوقت المتبقي: <span id="time">05:00</span></div>
        <div id="cheat-msg" class="warning-text hidden">⚠️ تحذير: تم تسجيل محاولة خروج! لا تغادر الصفحة.</div>
        
        <form id="quiz-form">
            <div id="questions-container"></div>
            <button type="button" onclick="submitExam()" id="submit-btn" class="btn">إرسال الإجابات الآن</button>
        </form>
    </div>

    <!-- 3. شاشة رسالة النجاح -->
    <div id="end-screen" class="hidden">
        <div style="text-align: center;">
            <h2 style="color: var(--secondary);">تم الإرسال بنجاح! ✔️</h2>
            <p>لقد وصلت إجاباتك للمعلم. يمكنك إغلاق الصفحة الآن.</p>
        </div>
    </div>
</div>

<script>
    // --- الإعدادات ---
    const FORMSPREE_URL = "https://formspree.io/f/mrerdbqb"; 
    const EXAM_MINUTES = 5;
    
    // أضف أسئلتك هنا بنفس التنسيق
    const allQuestions = [
        { id: 1, q: "لو بنعمل برنامج لعمل  ساندوتش جبنة إيه هو الترتيب المنطقي اللي الكمبيوتر لازم يتبعه؟", options: ["حط الجبنة، اشري العيش، اكل الساندوتش.", "جيب العيش، حط الجبنة، اقفل الساندوتش.", "اقفل الساندوتش، جيب العيش، حط الجبنة."], correct: "جيب العيش، حط الجبنة، اقفل الساندوتش." },
        { id: 2, q: "تخيل إن عندنا متغير صندوق اسمه My_Balance رصيدي وقيمته الحالية 100 جنيه. لو نفذنا الأمر ده: My_Balance = 20 تفتكر الصندوق دلوقتي جواه كام؟", options: ["20 جنيه (لأن القيمة الجديدة بتمسح القديمة وتعدل مكانها)", "100 جنيه (لأن الـ 100 هي اللي دخلت الأول)", "120 جنيه جمع الـ 20 على الـ 100."], correct: "20 جنيه (لأن القيمة الجديدة بتمسح القديمة وتعدل مكانها)" },
        { id: 3, q: "في لعبة ببجي مثلاً، فيه كود بيقول (لو دم اللاعب وصل لـ 0 -> يخرج من الجيم). الـ 0 هنا بنسميه إيه في البرمجة؟", options: ["اسم البرنامج.", "الشرط (Condition).", "التكرار (Loop)."], correct: "الشرط (Condition)." },
        { id: 4, q: "لو أنت بتعمل خانة رقم الموبايل في أبليكيشن، تفتكر الكمبيوتر أحسن له يخزن الرقم ده كـ نص (String) ولا كـ رقم (Number)؟ (فكر فيها: هل بنحتاج نجمع أو نضرب أرقام التليفونات؟)", options: ["رقم (Number): عشان هو فعلاً أرقام.", "نص (String): عشان مش بنعمل عليه عمليات حسابية وممكن يبدأ بـ (0) والشمال في الأرقام ملوش قيمة.", "صورة (Image): عشان يظهر بشكل شيك."], correct: "نص (String): عشان مش بنعمل عليه عمليات حسابية وممكن يبدأ بـ (0) والشمال في الأرقام ملوش قيمة." }
    ];

    let timer;
    let cheatCount = 0;

    // منع الدخول المزدوج (الميزة 3)
    if (localStorage.getItem("exam_done_mrerdbqb")) {
        document.querySelector(".container").innerHTML = "<h2 style='color:red'>عفواً! قمت بأداء هذا الامتحان مسبقاً ولا يسمح لك بالدخول ثانية.</h2>";
    }

    // ترتيب عشوائي للأسئلة (الميزة 5)
    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startExam() {
        const nameInput = document.getElementById("student-name");
        if (!nameInput.value.trim()) return alert("يجب كتابة اسمك الثلاثي أولاً!");

        localStorage.setItem("temp_user", nameInput.value);
        document.getElementById("start-screen").classList.add("hidden");
        document.getElementById("exam-screen").classList.remove("hidden");

        renderQuestions();
        startTimer();
        
        // كشف محاولات الغش (الميزة 4)
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) {
                cheatCount++;
                document.getElementById("cheat-msg").classList.remove("hidden");
            }
        });
    }

    function renderQuestions() {
        const container = document.getElementById("questions-container");
        const shuffled = shuffle([...allQuestions]);
        
        shuffled.forEach((item, index) => {
            let html = `
                <div class="question-box">
                    <p><strong>س${index + 1}:</strong> ${item.q}</p>
                    ${item.options.map(opt => `
                        <label style="display:block; margin: 8px 0; cursor:pointer;">
                            <input type="radio" name="q${item.id}" value="${opt}"> ${opt}
                        </label>
                    `).join('')}
                </div>`;
            container.innerHTML += html;
        });
    }

    function startTimer() {
        let sec = EXAM_MINUTES * 60;
        timer = setInterval(() => {
            sec--;
            let m = Math.floor(sec / 60);
            let s = sec % 60;
            document.getElementById("time").innerText = `${m}:${s < 10 ? '0'+s : s}`;
            if (sec <= 0) {
                alert("انتهى الوقت! سيتم إرسال إجاباتك الحالية.");
                submitExam();
            }
        }, 1000);
    }

    async function submitExam() {
        clearInterval(timer);
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.innerText = "جاري الحفظ وإرسال النتيجة...";

        const name = localStorage.getItem("temp_user");
        let score = 0;
        let studentAnswers = {};

        allQuestions.forEach(item => {
            const selected = document.querySelector(`input[name="q${item.id}"]:checked`);
            const answer = selected ? selected.value : "لم يحل";
            if (answer === item.correct) score++;
            studentAnswers[`سؤال_${item.id}`] = answer;
        });

        // تجميع البيانات للإرسال (الميزة 1 و 2)
        const finalData = {
            اسم_الطالب: name,
            النتيجة_النهائية: `${score} من ${allQuestions.length}`,
            عدد_مرات_الخروج_للغش: cheatCount,
            تفاصيل_الإجابات: studentAnswers,
            تاريخ_الامتحان: new Date().toLocaleString('ar-EG')
        };

        try {
            await fetch(FORMSPREE_URL, {
                method: 'POST',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                body: JSON.stringify(finalData)
            });
            
            // قفل الامتحان للأبد على هذا الجهاز
            localStorage.setItem("exam_done_mrerdbqb", "true");
            document.getElementById("exam-screen").classList.add("hidden");
            document.getElementById("end-screen").classList.remove("hidden");
        } catch (e) {
            alert("خطأ في الاتصال! حاول الضغط على زر الإرسال مرة أخرى.");
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
